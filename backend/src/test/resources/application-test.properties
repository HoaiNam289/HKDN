spring.datasource.url=jdbc:h2:mem:hkdn;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=test-only-secret-with-at-least-32-bytes
jwt.issuer=educertify-test
jwt.access-token-ttl=PT15M
app.bootstrap-admin.enabled=false
