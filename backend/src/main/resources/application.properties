spring.application.name=hkdn

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/hkdn
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.issuer=educertify
jwt.access-token-ttl=PT15M

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

storage.root=${STORAGE_ROOT:./storage}
storage.max-file-size=${STORAGE_MAX_FILE_SIZE:10485760}
signature.private-key-base64=${EDUCERTIFY_PRIVATE_KEY_BASE64:}
signature.public-key-base64=${EDUCERTIFY_PUBLIC_KEY_BASE64:}
signature.key-id=${EDUCERTIFY_KEY_ID:educertify-default}
blockchain.enabled=${BLOCKCHAIN_ENABLED:false}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:}
blockchain.network=${BLOCKCHAIN_NETWORK:unconfigured}
spring.servlet.multipart.max-file-size=${STORAGE_MAX_FILE_SIZE:10485760}
spring.servlet.multipart.max-request-size=${STORAGE_MAX_FILE_SIZE:10485760}
